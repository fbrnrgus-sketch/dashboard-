<!doctype html><html lang="ko"><meta charset="utf-8">
<title>viewport frame</title>
<style>
html,body{margin:0;height:100%;background:#04090d;overflow:hidden}
#wrap{position:absolute;left:0;top:0;transform-origin:0 0}
iframe{border:0;display:block;background:#000}
#lab{position:fixed;right:6px;bottom:4px;color:#4ec9c9;font:11px/1.4 system-ui,sans-serif;z-index:9;opacity:.8}
</style>
<div id="wrap"><iframe id="f" title="preview"></iframe></div>
<div id="lab"></div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var w = parseInt(q.get("w")||"1920",10), h = parseInt(q.get("h")||"993",10);
  var src = q.get("src") || "./index.html";
  var f = document.getElementById("f");
  f.width = w; f.height = h; f.src = src + (src.indexOf("?")<0 ? "?" : "&") + "frame=1";
  var s = Math.min(window.innerWidth / w, window.innerHeight / h);
  document.getElementById("wrap").style.transform = "scale(" + s + ")";
  document.getElementById("lab").textContent = w + "×" + h + " @" + Math.round(s*100) + "%";
})();
</script>
</html>
